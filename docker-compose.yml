services:
  postgres:
    image: postgres:16-alpine
    container_name: interview_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_mock_interview_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_mock_interview_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
